name: Deploy to TEST

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      branch: 'develop'
      server-path: '~/megatest'
      service-name: 'megatest'
    secrets:
      HOST: ${{ secrets.HOST }}
      USER: ${{ secrets.USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
