name: Deploy to TEST

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA (optional, leave empty for latest)'
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      branch: 'develop'
      service-name: 'megatest'
      server-path: '~/megatest'
      commit_sha: ${{ inputs.commit_sha }}
    secrets:
      HOST: ${{ secrets.HOST }}
      USER: ${{ secrets.USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
