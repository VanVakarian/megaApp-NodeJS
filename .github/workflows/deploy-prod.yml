name: Deploy to PROD

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA (optional, leave empty for latest)'
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      service-name: 'megaback'
      server-path: '/root/megaback'
      commit_sha: ${{ github.event.inputs.commit_sha || '' }}
    secrets:
      HOST: ${{ secrets.HOST }}
      USER: ${{ secrets.USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
